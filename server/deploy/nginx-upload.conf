# /etc/nginx/sites-available/upload.velowind.de
# First line of defence against floods; the service has its own, finer limits
limit_req_zone $binary_remote_addr zone=velowind_upload:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name upload.velowind.de;
    # certbot renews through this block
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Debian 12 ships nginx 1.22; on 1.25+ write `listen 443 ssl;` plus `http2 on;` instead
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name upload.velowind.de;

    ssl_certificate /etc/letsencrypt/live/upload.velowind.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upload.velowind.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:velowind_ssl:1m;

    # No access log: IP addresses are not kept beyond the service's 7 days
    access_log off;

    client_max_body_size 110m;
    client_body_timeout 120s;

    location /v1/ {
        limit_req zone=velowind_upload burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8737;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Hand the upload to the service as it arrives instead of buffering it on disk first
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}
