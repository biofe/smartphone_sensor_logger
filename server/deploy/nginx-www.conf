# /etc/nginx/sites-available/velowind.de
# The project website for test riders: static files from /srv/velowind/www (copied from website/ in the repo)
server {
    listen 80;
    listen [::]:80;
    server_name velowind.de www.velowind.de;
    # certbot renews through this block
    location / {
        return 301 https://velowind.de$request_uri;
    }
}

server {
    # Debian 12 ships nginx 1.22; on 1.25+ write `listen 443 ssl;` plus `http2 on;` instead
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.velowind.de;

    ssl_certificate /etc/letsencrypt/live/velowind.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/velowind.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    return 301 https://velowind.de$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name velowind.de;

    ssl_certificate /etc/letsencrypt/live/velowind.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/velowind.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:velowind_www_ssl:1m;

    # No access log: the site promises riders that it keeps nothing about visitors
    access_log off;

    root /srv/velowind/www;
    index index.html;
    autoindex off;

    # The page loads nothing from other sites; it only asks apk.velowind.de for the newest version number
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://apk.velowind.de; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /apk {
        return 302 https://apk.velowind.de/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
