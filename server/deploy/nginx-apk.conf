# /etc/nginx/sites-available/apk.velowind.de
# Static files only: latest.json and the APKs that GitHub Actions copies to /srv/velowind/publish/apk
server {
    listen 80;
    listen [::]:80;
    server_name apk.velowind.de;
    # certbot renews through this block
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Debian 12 ships nginx 1.22; on 1.25+ write `listen 443 ssl;` plus `http2 on;` instead
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apk.velowind.de;

    ssl_certificate /etc/letsencrypt/live/apk.velowind.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apk.velowind.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:velowind_apk_ssl:1m;

    # No access log: the daily update check would otherwise log every rider's IP address
    access_log off;

    root /srv/velowind/publish/apk;
    autoindex off;

    # The address to give test riders: always the newest version
    location = / {
        return 302 /bike-sensor-logger.apk;
    }

    # Apps must always see the current manifest
    location = /latest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ ^/[A-Za-z0-9._-]+\.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
